<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Consultant console after the split</title>
  <desc id="desc">Diagram showing ConsultantLayout retaining staff chrome while client routes move elsewhere.</desc>
  <rect x="0" y="0" width="960" height="540" fill="#ecfeff" />
  <rect x="48" y="48" width="864" height="444" rx="32" fill="#ffffff" stroke="#0ea5e9" stroke-width="2" />
  <rect x="84" y="96" width="220" height="360" rx="16" fill="#0f172a" />
  <text x="84" y="80" font-family="'Inter', 'Segoe UI', sans-serif" font-size="20" fill="#0f172a" font-weight="700">
    Consultant Console — After
  </text>
  <text x="110" y="130" font-size="15" font-family="'Inter', sans-serif" fill="#38bdf8" font-weight="600">
    ConsultantLayout
  </text>
  <text x="110" y="160" font-size="13" fill="#bae6fd" font-family="'Inter', sans-serif">
    ▸ Owner Console
  </text>
  <text x="110" y="186" font-size="13" fill="#bae6fd" font-family="'Inter', sans-serif">
    ▸ Consultant Workspace
  </text>
  <text x="110" y="212" font-size="13" fill="#bae6fd" font-family="'Inter', sans-serif">
    ▸ Impersonation Toggle
  </text>
  <text x="110" y="238" font-size="13" fill="#bae6fd" font-family="'Inter', sans-serif">
    ▸ Metric Templates
  </text>
  <rect x="340" y="96" width="500" height="360" rx="24" fill="#e0f2fe" />
  <text x="360" y="136" font-size="24" font-family="'Inter', sans-serif" fill="#0369a1" font-weight="700">
    AppShell → ConsultantLayout
  </text>
  <text x="360" y="176" font-size="15" font-family="'Inter', sans-serif" fill="#0f172a">
    Consultant routes still load AppShell, but ClientLayout takes
    over member experiences. Impersonation logs continue to wrap
    around Console access and are recorded via LogImpersonationEvent.
  </text>
  <rect x="360" y="248" width="460" height="120" rx="18" fill="#cffafe" stroke="#06b6d4" />
  <text x="380" y="280" font-size="14" font-family="'Inter', sans-serif" fill="#0f172a" font-weight="600">
    Scope Guard
  </text>
  <text x="380" y="306" font-size="13" font-family="'Inter', sans-serif" fill="#155e75">
    Middleware enforces org binding before nav is injected.
  </text>
  <text x="380" y="332" font-size="13" font-family="'Inter', sans-serif" fill="#155e75">
    Members never see ConsultantLayout after the split.
  </text>
</svg>
